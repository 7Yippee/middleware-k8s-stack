# Helmfile is an optional entry point. The scripts/ workflow is the primary path.
# Release list is generated from config/components.txt so the two stay in sync.
# Usage:
#   helmfile -e dev apply
#   helmfile -e prod apply

helmDefaults:
  wait: true
  atomic: true
  timeout: 600
  createNamespace: true

environments:
  dev:
    values:
      - envs/dev/global.yaml
  prod:
    values:
      - envs/prod/global.yaml

---

{{- $defaultRegistry := "oci://registry-1.docker.io/bitnamicharts" -}}
{{- $env := .Environment.Name -}}
{{- $ns := .Values.namespace | default "middleware" -}}

releases:
{{- range $line := readFile "config/components.txt" | splitList "\n" }}
  {{- $trimmed := trim $line }}
  {{- if and (ne $trimmed "") (not (hasPrefix "#" $trimmed)) }}
    {{- $parts := splitList " " $trimmed }}
    {{- $name := index $parts 0 }}
    {{- $chart := index $parts 1 }}
    {{- $version := index $parts 2 }}
    {{- $registry := $defaultRegistry }}
    {{- if ge (len $parts) 4 }}{{ $registry = index $parts 3 }}{{ end }}
  - name: {{ $name }}
    namespace: {{ $ns }}
    chart: {{ $registry }}/{{ $chart }}
    version: {{ $version }}
    condition: {{ $name }}.enabled
    values:
      - envs/{{ $env }}/global.yaml
      - envs/{{ $env }}/{{ $name }}.yaml
    {{- if eq $env "prod" }}
      - envs/prod/_hardening.yaml
    {{- end }}
  {{- end }}
{{- end }}
