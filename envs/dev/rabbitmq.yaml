image:
  registry: registry.cn-guangzhou.aliyuncs.com
  repository: tools_y/rabbitmq
  tag: 4.1.3-debian-12-r1
  pullPolicy: IfNotPresent

replicaCount: 1

auth:
  username: admin
  # Password and Erlang cookie are read from k8s Secret 'rabbitmq-auth'.
  # Create via: scripts/gen-secrets.sh rabbitmq
  existingPasswordSecret: rabbitmq-auth
  existingErlangSecret: rabbitmq-auth
  enableLoopbackUser: false

plugins: "rabbitmq_management rabbitmq_peer_discovery_k8s rabbitmq_prometheus"
extraPlugins: "rabbitmq_mqtt rabbitmq_stomp rabbitmq_web_stomp"

persistence:
  enabled: true
  size: 2Gi

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

service:
  type: ClusterIP

metrics:
  enabled: false

volumePermissions:
  image:
    registry: registry.cn-guangzhou.aliyuncs.com
    repository: tools_y/os-shell
    tag: 12-debian-12-r50

